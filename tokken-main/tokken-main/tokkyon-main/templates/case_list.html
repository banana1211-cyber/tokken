<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokkyon - 案件一覧</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .search-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .search-bar input {
            flex: 1;
        }

        .cases-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: 8px;
            overflow: hidden;
        }

        .cases-table th {
            background: var(--surface-hover);
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.85rem;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        .cases-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .cases-table tr:last-child td {
            border-bottom: none;
        }

        .cases-table tr:hover td {
            background: var(--surface-hover);
        }

        .repo-link {
            color: var(--primary);
            text-decoration: none;
            word-break: break-all;
        }

        .repo-link:hover {
            text-decoration: underline;
        }

        .badge {
            display: inline-block;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.1rem 0.55rem;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--muted);
        }

        .empty-state p {
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .status-draft     { background: #334155; color: #94a3b8; }
        .status-in_review { background: #1e3a5f; color: #60a5fa; }
        .status-submitted { background: #14532d; color: #4ade80; }
        .status-completed { background: #3b0764; color: #c084fc; }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <h1>📄 Tokkyon</h1>
                <nav style="display:flex; gap:1rem; align-items:center;">
                    <a href="/" class="settings-link">🚀 新規生成</a>
                    <a href="/settings" class="settings-link">⚙️ 設定</a>
                </nav>
            </div>
            <p class="subtitle">GitHubリポジトリから特許明細書を自動生成</p>
        </header>

        <main class="main">
            <h2 style="margin-bottom:1.25rem;">📋 案件一覧</h2>

            <div class="search-bar">
                <input type="text" id="search-input" placeholder="リポジトリURLで検索..." />
                <button class="btn btn-secondary" id="search-btn">🔍 検索</button>
                <button class="btn btn-secondary" id="clear-btn">✕ クリア</button>
            </div>

            <div id="table-area">
                <div class="empty-state">⏳ 読み込み中...</div>
            </div>
        </main>

        <footer class="footer">
            <p>Powered by FastAPI + LLM</p>
        </footer>
    </div>

    <script>
        let allProjects = [];

        async function loadProjects() {
            const tableArea = document.getElementById('table-area');
            try {
                const res = await fetch('/api/projects/');
                if (!res.ok) throw new Error('取得失敗');
                allProjects = await res.json();
                renderTable(allProjects);
            } catch (e) {
                tableArea.innerHTML = '<div class="empty-state">❌ データの読み込みに失敗しました</div>';
            }
        }

        function filterProjects(q) {
            if (!q) return allProjects;
            const lower = q.toLowerCase();
            return allProjects.filter(p =>
                (p.customer_name || '').toLowerCase().includes(lower) ||
                (p.github_repo_url || '').toLowerCase().includes(lower)
            );
        }

        function formatDate(isoStr) {
            if (!isoStr) return '-';
            const d = new Date(isoStr);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        const STATUS_MAP = {
            draft:     { label: '下書き',     cls: 'status-draft' },
            in_review: { label: 'レビュー中', cls: 'status-in_review' },
            submitted: { label: '提出済み',   cls: 'status-submitted' },
            completed: { label: '完了',       cls: 'status-completed' },
        };

        function renderTable(projects) {
            const tableArea = document.getElementById('table-area');
            if (!projects || projects.length === 0) {
                tableArea.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size:2rem;">📭</div>
                        <p>案件がありません。新規生成から特許明細書を作成してください。</p>
                    </div>`;
                return;
            }

            const rows = projects.map(p => {
                const st = STATUS_MAP[p.status] || { label: p.status, cls: 'status-draft' };
                const repoLink = p.github_repo_url
                    ? `<a class="repo-link" href="${escHtml(p.github_repo_url)}" target="_blank" rel="noopener">${escHtml(p.github_repo_url)}</a>`
                    : '（未設定）';
                return `<tr>
                    <td>${formatDate(p.created_at)}</td>
                    <td>${escHtml(p.customer_name || '（未設定）')}</td>
                    <td>${repoLink}</td>
                    <td><span class="badge ${st.cls}">${st.label}</span></td>
                    <td style="display:flex;gap:0.4rem;flex-wrap:wrap;">
                        <a href="/project/${escHtml(p.id)}" class="btn btn-small btn-secondary">📋 詳細</a>
                    </td>
                </tr>`;
            }).join('');

            tableArea.innerHTML = `
                <table class="cases-table">
                    <thead>
                        <tr>
                            <th>作成日時</th>
                            <th>顧客名</th>
                            <th>GitHubリポジトリURL</th>
                            <th>ステータス</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
        }

        function escHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        document.getElementById('search-btn').addEventListener('click', () => {
            renderTable(filterProjects(document.getElementById('search-input').value.trim()));
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            document.getElementById('search-input').value = '';
            renderTable(allProjects);
        });

        document.getElementById('search-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') renderTable(filterProjects(e.target.value.trim()));
        });

        loadProjects();
    </script>
</body>

</html>
