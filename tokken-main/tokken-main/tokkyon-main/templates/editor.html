<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特許明細書エディタ - Tokkyon</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        @page {
            size: A4 portrait;
            margin: 2cm;
        }
        @media print {
            .editor-header, .comments-panel, .modal { display: none !important; }
            .editor-container, .editor-main {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }
            .document-panel {
                display: block !important;
                flex: none !important;
                width: 100% !important;
                overflow: visible !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            .document-content {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                min-height: 0 !important;
                height: auto !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
            .patent-section { margin-bottom: 1rem; }
            h1, h2, h3, h4 { break-after: avoid; page-break-after: avoid; }
            table, figure, .figure { break-inside: avoid; page-break-inside: avoid; }
            .patent-section#section-10, .patent-section#section-11 {
                break-before: page;
                page-break-before: always;
            }
            body { background: white !important; color: black !important; }
            a { text-decoration: none; color: inherit; }
        }
    </style>
</head>

<body>
    <div class="editor-container">
        <!-- ヘッダー -->
        <header class="editor-header">
            <div class="header-left">
                <a href="/" class="back-link">← 戻る</a>
                <h1>📄 特許明細書エディタ</h1>
            </div>
            <div class="header-right" style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                <button id="edit-btn" class="btn btn-secondary">✏️ 編集</button>
                <button id="save-btn" class="btn btn-primary" style="display:none;">💾 保存</button>
                <button id="cancel-edit-btn" class="btn btn-secondary" style="display:none;">キャンセル</button>
                <button id="print-btn" class="btn btn-secondary">🖨️ PDF保存</button>
                <button id="export-btn" class="btn btn-secondary">📥 HTMLエクスポート</button>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <div class="editor-main">
            <!-- 明細書本文 -->
            <div class="document-panel">
                <div id="document-content" class="document-content">
                    <p class="loading">読み込み中...</p>
                </div>
            </div>

            <!-- コメントパネル -->
            <div class="comments-panel">
                <div class="comments-header">
                    <h2>💬 コメント</h2>
                    <span id="comment-count" class="comment-count">0件</span>
                </div>
                <div id="comments-list" class="comments-list">
                    <p class="no-comments">コメントはありません</p>
                </div>
            </div>
        </div>

        <!-- コメント追加モーダル -->
        <div id="comment-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>コメントを追加</h3>
                    <button class="modal-close" id="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="selected-text-preview">
                        <label>選択テキスト:</label>
                        <p id="selected-text-display"></p>
                    </div>
                    <div class="form-group">
                        <label for="comment-author">名前</label>
                        <input type="text" id="comment-author" value="弁理士" placeholder="名前を入力">
                    </div>
                    <div class="form-group">
                        <label for="comment-text">コメント</label>
                        <textarea id="comment-text" rows="4" placeholder="コメントを入力..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="cancel-comment" class="btn btn-secondary">キャンセル</button>
                    <button id="submit-comment" class="btn btn-primary">追加</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const patentId = '{{ patent_id }}';
        let patentContent = '';
        let comments = [];
        let selectedRange = null;

        // 初期化
        document.addEventListener('DOMContentLoaded', async () => {
            await loadPatent();
            await loadComments();
            setupEventListeners();
        });

        // 明細書本文をDBから読み込み（フォールバック: JSONファイル）
        async function loadPatent() {
            try {
                // まずDBのpatent_draftsから取得
                const dbRes = await fetch(`/api/patent-drafts/${patentId}`);
                if (dbRes.ok) {
                    const draft = await dbRes.json();
                    patentContent = draft.content || '';
                    // project_idがあれば戻るリンクを案件詳細に変更
                    if (draft.project_id) {
                        document.querySelector('.back-link').href = `/projects/${draft.project_id}`;
                    }
                } else {
                    // フォールバック: 従来のJSONベースAPI
                    const jsonRes = await fetch(`/api/patent/${patentId}`);
                    if (!jsonRes.ok) throw new Error('明細書が見つかりません');
                    const data = await jsonRes.json();
                    patentContent = data.content || '';
                }
                renderDocument();
            } catch (error) {
                document.getElementById('document-content').innerHTML =
                    `<p class="error">❌ ${error.message}</p>`;
            }
        }

        // コメント一覧をDBから読み込み
        async function loadComments() {
            try {
                const res = await fetch(`/api/comments/?draft_id=${patentId}`);
                if (res.ok) {
                    comments = await res.json();
                } else {
                    comments = [];
                }
            } catch {
                comments = [];
            }
            renderComments();
        }

        // 明細書を表示
        function renderDocument() {
            document.getElementById('document-content').innerHTML = patentContent;
        }

        // コメント一覧を表示
        function renderComments() {
            const list = document.getElementById('comments-list');
            const count = document.getElementById('comment-count');

            count.textContent = `${comments.length}件`;

            if (comments.length === 0) {
                list.innerHTML = '<p class="no-comments">コメントはありません<br><small>テキストを選択してコメントを追加できます</small></p>';
                return;
            }

            list.innerHTML = comments.map(comment => `
                <div class="comment-card ${comment.resolved ? 'resolved' : ''}" data-comment-id="${comment.id}">
                    <div class="comment-header">
                        <span class="comment-author">${escHtml(comment.author || '弁理士')}</span>
                        <span class="comment-time">${formatTime(comment.created_at)}</span>
                    </div>
                    ${comment.selected_text ? `<div class="comment-quote">"${escHtml(truncate(comment.selected_text, 50))}"</div>` : ''}
                    <div class="comment-text">${escHtml(comment.text)}</div>

                    <!-- 返信 -->
                    <div class="comment-replies">
                        ${(comment.replies || []).map(reply => `
                            <div class="reply">
                                <span class="reply-author">${escHtml(reply.author || '担当者')}</span>
                                <span class="reply-time">${formatTime(reply.created_at)}</span>
                                <p class="reply-text">${escHtml(reply.text)}</p>
                            </div>
                        `).join('')}
                    </div>

                    <!-- アクション -->
                    <div class="comment-actions">
                        <button class="btn-action reply-btn" data-comment-id="${comment.id}">↩️ 返信</button>
                        <button class="btn-action resolve-btn" data-comment-id="${comment.id}" data-resolved="${comment.resolved}">
                            ${comment.resolved ? '🔄 未解決に戻す' : '✅ 解決済み'}
                        </button>
                    </div>

                    <!-- 返信フォーム（非表示） -->
                    <div class="reply-form" id="reply-form-${comment.id}" style="display: none;">
                        <input type="text" class="reply-author-input" placeholder="名前" value="担当者">
                        <textarea class="reply-text-input" rows="2" placeholder="返信を入力..."></textarea>
                        <div class="reply-form-actions">
                            <button class="btn btn-small btn-secondary cancel-reply-btn">キャンセル</button>
                            <button class="btn btn-small btn-primary submit-reply-btn" data-comment-id="${comment.id}">送信</button>
                        </div>
                    </div>
                </div>
            `).join('');

            setupCommentActions();
        }

        // イベントリスナー設定
        function setupEventListeners() {
            document.getElementById('document-content').addEventListener('mouseup', handleTextSelection);
            document.getElementById('modal-close').addEventListener('click', closeModal);
            document.getElementById('cancel-comment').addEventListener('click', closeModal);
            document.getElementById('submit-comment').addEventListener('click', submitComment);
            document.getElementById('export-btn').addEventListener('click', exportHTML);
            document.getElementById('edit-btn').addEventListener('click', enterEditMode);
            document.getElementById('save-btn').addEventListener('click', saveVersion);
            document.getElementById('cancel-edit-btn').addEventListener('click', exitEditMode);
            document.getElementById('print-btn').addEventListener('click', () => window.print());
        }

        // テキスト選択ハンドラ
        function handleTextSelection() {
            const selection = window.getSelection();
            const selectedText = selection.toString().trim();
            if (selectedText.length > 0) {
                selectedRange = { text: selectedText, start: 0, end: selectedText.length };
                document.getElementById('selected-text-display').textContent = truncate(selectedText, 100);
                document.getElementById('comment-modal').style.display = 'flex';
            }
        }

        // コメント送信（DBへ保存）
        async function submitComment() {
            const author = document.getElementById('comment-author').value;
            const text = document.getElementById('comment-text').value;
            if (!text.trim()) { alert('コメントを入力してください'); return; }

            try {
                const res = await fetch('/api/comments/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        draft_id: patentId,
                        author,
                        text,
                        selected_text: selectedRange?.text || '',
                        selection_start: selectedRange?.start || 0,
                        selection_end: selectedRange?.end || 0
                    })
                });
                if (res.ok) {
                    await loadComments();
                    closeModal();
                    document.getElementById('comment-text').value = '';
                }
            } catch { alert('コメントの追加に失敗しました'); }
        }

        // コメントアクション設定
        function setupCommentActions() {
            // 返信ボタン
            document.querySelectorAll('.reply-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const form = document.getElementById(`reply-form-${btn.dataset.commentId}`);
                    form.style.display = form.style.display === 'none' ? 'block' : 'none';
                });
            });

            // 解決ボタン（DB更新）
            document.querySelectorAll('.resolve-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const commentId = btn.dataset.commentId;
                    const currentResolved = btn.dataset.resolved === 'true';
                    await fetch(`/api/comments/${commentId}/resolve`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ resolved: !currentResolved })
                    });
                    await loadComments();
                });
            });

            // 返信キャンセル
            document.querySelectorAll('.cancel-reply-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.target.closest('.reply-form').style.display = 'none';
                });
            });

            // 返信送信（DBへ保存）
            document.querySelectorAll('.submit-reply-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const commentId = btn.dataset.commentId;
                    const form = document.getElementById(`reply-form-${commentId}`);
                    const author = form.querySelector('.reply-author-input').value;
                    const text = form.querySelector('.reply-text-input').value;
                    if (!text.trim()) return;

                    await fetch('/api/comments/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            draft_id: patentId,
                            author,
                            text,
                            parent_comment_id: commentId
                        })
                    });
                    await loadComments();
                });
            });
        }

        // モーダルを閉じる
        function closeModal() {
            document.getElementById('comment-modal').style.display = 'none';
            selectedRange = null;
        }

        // 編集モード開始
        function enterEditMode() {
            const content = document.getElementById('document-content');
            content.contentEditable = 'true';
            content.style.outline = '2px solid var(--primary, #6366f1)';
            content.style.borderRadius = '4px';
            document.getElementById('edit-btn').style.display = 'none';
            document.getElementById('save-btn').style.display = 'inline-flex';
            document.getElementById('cancel-edit-btn').style.display = 'inline-flex';
        }

        // 編集モード終了
        function exitEditMode() {
            const content = document.getElementById('document-content');
            content.contentEditable = 'false';
            content.style.outline = '';
            renderDocument();
            document.getElementById('edit-btn').style.display = 'inline-flex';
            document.getElementById('save-btn').style.display = 'none';
            document.getElementById('cancel-edit-btn').style.display = 'none';
        }

        // 新バージョンとして保存
        async function saveVersion() {
            const content = document.getElementById('document-content').innerHTML;
            try {
                const res = await fetch(`/api/patent/${patentId}/content`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                if (!res.ok) throw new Error('保存失敗');
                patentContent = content;
                alert('✅ 保存しました');
                exitEditMode();
            } catch { alert('❌ 保存に失敗しました'); }
        }

        // HTMLエクスポート
        function exportHTML() {
            const blob = new Blob(
                [`<!DOCTYPE html><html><head><meta charset="utf-8"><title>特許明細書</title></head><body>${patentContent}</body></html>`],
                { type: 'text/html' }
            );
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `patent_${patentId}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ユーティリティ
        function formatTime(isoString) {
            if (!isoString) return '-';
            const d = new Date(isoString);
            return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function truncate(text, maxLength) {
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        function escHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>

</html>
